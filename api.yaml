        monthlyOutboundCount:
          type: integer
          description: 本月出库数量
        pendingInboundCount:
          type: integer
          description: 待处理入库单数量
        pendingOutboundCount:
          type: integer
          description: 待处理出库单数量
        warehouseCount:
          type: integer
          description: 仓库数量
        customerCount:
          type: integer
          description: 客户数量
        productCount:
          type: integer
          description: 商品数量
    DashboardStatsResp:
      allOf:
        - $ref: '#/components/schemas/DashboardStats'
    Warehouse:
      type: object
      properties:
        id:
          type: integer
          description: 仓库ID
        name:
          type: string
          description: 仓库名称
        tel:
          type: string
          description: 电话
        fax:
          type: string
          description: 传真
        address:
          $ref: '#/components/schemas/Address'
          description: 仓库地址
    CreateWarehouseReq:
      allOf:
        - $ref: '#/components/schemas/Warehouse'
    CreateWarehouseResp:
      allOf:
