  '/procurement/order/{id}/send':
    post:
      summary: 下发注文书
      operationId: sendOrder
      tags:
        - 采购
      parameters:
        - name: id
          in: path
          required: true
          description: 注文ID
          schema:
            type: integer
      responses:
        '200':
          description: 成功下发注文书
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: 注文不存在
        '409':
          description: 当前状态不允许下发
        '500':
          description: 服务器内部错误
  '/procurement/order/{id}/complete':
    post:
      summary: 完成注文书
      operationId: completeOrder
      tags:
        - 采购
      parameters:
        - name: id
          in: path
          required: true
          description: 注文ID
          schema:
            type: integer
      responses:
        '200':
          description: 成功完成注文书
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: 注文不存在
        '409':
          description: 当前状态不允许完成
        '500':
          description: 服务器内部错误
  '/procurement/order/{id}/cancel':
    post:
      summary: 取消注文书
      operationId: cancelOrderAction
      tags:
        - 采购
      parameters:
        - name: id
          in: path
          required: true
          description: 注文ID
          schema:
            type: integer
      responses:
        '200':
          description: 成功取消注文书
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: 注文不存在
        '409':
          description: 当前状态不允许取消
        '500':
          description: 服务器内部错误
  /procurement/orderPrints:
    get:
      summary: 获取注文打印任务列表
      operationId: listOrderPrints
      tags:
        - 采购
      description: |
        获取注文打印版Excel生成任务的列表，支持按订单编号、客户和状态等条件筛选。
      parameters:
        - name: page
          in: query
          description: 页码
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: itemsPerPage
          in: query
          description: 每页数量
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: orderNumber
          in: query
          description: 注文编号筛选
          schema:
            type: string
        - name: customerId
          in: query
          description: 客户ID筛选
          schema:
            type: integer
        - name: status
          in: query
          description: 打印任务状态筛选
          schema:
            type: string
            enum:
              - pending
              - processing
              - completed
              - failed
        - name: startDate
          in: query
          description: 开始日期筛选（任务创建时间）
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: 结束日期筛选（任务创建时间）
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 成功获取注文打印任务列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPrintListResp'
        '400':
          description: 请求参数错误
        '500':
          description: 服务器内部错误
  /procurement/orderPrint/generate:
    post:
      summary: 生成注文打印版Excel
      operationId: generateOrderPrint
      tags:
        - 采购
      description: |
        生成指定注文书的打印版Excel文件。
        打印任务将异步执行，返回任务ID用于查询状态和下载。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderPrintReq'
      responses:
        '202':
          description: 注文打印任务已接受
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPrintResp'
        '400':
          description: 请求参数错误
        '404':
          description: 注文不存在
        '409':
          description: 注文状态不支持生成打印版
        '500':
          description: 服务器内部错误
  '/procurement/orderPrints/{printId}/status':
    get:
      summary: 获取注文打印任务状态
      operationId: getOrderPrintStatus
      tags:
        - 采购
      description: |
        根据打印任务ID获取生成状态。
        可用于轮询检查注文打印版是否生成完成。
      parameters:
        - name: printId
          in: path
          required: true
          description: 注文打印任务ID
          schema:
            type: string
      responses:
        '200':
          description: 成功获取注文打印任务状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPrint'
        '404':
          description: 打印任务不存在
        '500':
          description: 服务器内部错误
  '/procurement/orderPrints/{printId}/download':
    get:
      summary: 下载注文打印版
      operationId: downloadOrderPrint
      tags:
        - 采购
      description: |
        下载已生成的注文打印版Excel文件。
      parameters:
        - name: printId
          in: path
          required: true
          description: 注文打印任务ID
          schema:
            type: string
      responses:
        '200':
          description: 成功下载注文打印版文件
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
              examples:
                order_print_excel:
                  summary: 注文打印版Excel
          headers:
            Content-Disposition:
              description: 文件下载附件头
              schema:
                type: string
                example: attachment; filename="order_print_20240115.xlsx"
            Content-Length:
              description: 文件大小
              schema:
                type: integer
        '404':
          description: 打印任务不存在或尚未生成完成
        '410':
          description: 下载链接已过期
        '500':
          description: 服务器内部错误
  /containers:
