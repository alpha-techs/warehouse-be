openapi: 3.1.0
info:
  title: 库存管理系统接口
  version: 0.0.1
servers:
  - url: 'https://development.gigantic-server.com/v1'
    description: Development server
  - url: 'https://staging.gigantic-server.com/v1'
    description: Staging server
  - url: 'https://api.gigantic-server.com/v1'
    description: Production server
security:
  - oauth2: []
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: 用户登录
      operationId: login
      tags:
        - 认证
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginReq'
            examples:
              default:
                value:
                  email: employee@example.com
                  password: Secret123!
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResp'
              examples:
                default:
                  value:
                    tokens:
                      tokenType: Bearer
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                      expiresIn: 3600
                      refreshToken: dGhpc19pc19hX3NhbXBsZV9yZWZyZXNoX3Rva2Vu
                      refreshTokenExpiresIn: 604800
                    employee:
                      id: emp_12345
                      email: employee@example.com
                      name: 张三
                      roles:
                        - admin
                        - warehouse_manager
                      lastLoginAt: '2024-05-06T03:20:00Z'
                      avatarUrl: 'https://cdn.example.com/avatar/emp_12345.png'
  /auth/refresh:
    post:
      summary: 刷新访问令牌
      operationId: refreshToken
      tags:
        - 认证
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenReq'
            examples:
              default:
                value:
                  refreshToken: dGhpc19pc19hX3NhbXBsZV9yZWZyZXNoX3Rva2Vu
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResp'
              examples:
                default:
                  value:
                    tokens:
                      tokenType: Bearer
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                      expiresIn: 3600
                      refreshToken: Zm9vX3JlZnJlc2hfdG9rZW4
                      refreshTokenExpiresIn: 604800
                    employee:
                      id: emp_12345
                      email: employee@example.com
                      name: 张三
                      roles:
                        - admin
                        - warehouse_manager
                      lastLoginAt: '2024-05-06T03:20:00Z'
                      avatarUrl: 'https://cdn.example.com/avatar/emp_12345.png'
  /auth/logout:
    post:
      summary: 用户登出
      operationId: logout
      tags:
        - 认证
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutReq'
            examples:
              default:
                value:
                  refreshToken: dGhpc19pc19hX3NhbXBsZV9yZWZyZXNoX3Rva2Vu
      responses:
        '204':
          description: 登出成功，无返回内容
  /auth/profile:
    get:
      summary: 获取当前登录员工信息
      operationId: getAuthProfile
      tags:
        - 认证
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProfileResp'
              examples:
                default:
                  value:
                    employee:
                      id: emp_12345
                      email: employee@example.com
                      name: 张三
                      roles:
                        - admin
                        - warehouse_manager
                      lastLoginAt: '2024-05-06T03:20:00Z'
                      avatarUrl: 'https://cdn.example.com/avatar/emp_12345.png'
