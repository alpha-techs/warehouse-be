    put:
      summary: 更新仓库
      operationId: updateWarehouse
      tags:
        - 仓库
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
            description: 仓库 ID
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Warehouse'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWarehouseResp'
    delete:
      summary: 删除仓库
      operationId: deleteWarehouse
