            type: integer
            description: 集装箱ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        password:
          tokenUrl: /auth/login
          scopes: {}
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthTokens:
      type: object
      description: JWT令牌信息
      required:
        - tokenType
        - accessToken
        - expiresIn
        - refreshToken
        - refreshTokenExpiresIn
      properties:
        tokenType:
          type: string
          description: 令牌类型，通常为Bearer
          example: Bearer
        accessToken:
          type: string
          description: Access Token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        expiresIn:
          type: integer
          format: int64
          description: Access Token有效期（秒）
          example: 3600
        refreshToken:
          type: string
          description: Refresh Token
          example: dGhpc19pc19hX3NhbXBsZV9yZWZyZXNoX3Rva2Vu
        refreshTokenExpiresIn:
          type: integer
          format: int64
          description: Refresh Token有效期（秒）
          example: 604800
    EmployeeProfile:
      type: object
      description: 员工基础信息
      required:
        - id
        - email
        - name
        - roles
      properties:
        id:
          type: string
          description: 员工ID
          example: emp_12345
        email:
          type: string
          format: email
          description: 员工邮箱
          example: employee@example.com
        name:
          type: string
          description: 员工姓名
          example: 张三
        roles:
          type: array
          description: 员工角色列表
          items:
            type: string
          example:
            - admin
            - warehouse_manager
        lastLoginAt:
          type: string
          format: date-time
          description: 上次登录时间
          example: '2024-05-06T03:20:00Z'
        avatarUrl:
          type: string
          format: uri
          description: 员工头像链接
          example: 'https://cdn.example.com/avatar/emp_12345.png'
    LoginReq:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: 员工邮箱
          example: employee@example.com
        password:
          type: string
          format: password
          description: 登录密码
          example: Secret123!
    LoginResp:
      type: object
      required:
        - tokens
        - employee
      properties:
        tokens:
          $ref: '#/components/schemas/AuthTokens'
        employee:
          $ref: '#/components/schemas/EmployeeProfile'
      example:
        tokens:
          tokenType: Bearer
          accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
          expiresIn: 3600
          refreshToken: dGhpc19pc19hX3NhbXBsZV9yZWZyZXNoX3Rva2Vu
          refreshTokenExpiresIn: 604800
        employee:
          id: emp_12345
          email: employee@example.com
          name: 张三
          roles:
            - admin
            - warehouse_manager
          lastLoginAt: '2024-05-06T03:20:00Z'
          avatarUrl: 'https://cdn.example.com/avatar/emp_12345.png'
    RefreshTokenReq:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Refresh Token
          example: dGhpc19pc19hX3NhbXBsZV9yZWZyZXNoX3Rva2Vu
    LogoutReq:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: 需要失效的Refresh Token
          example: dGhpc19pc19hX3NhbXBsZV9yZWZyZXNoX3Rva2Vu
    AuthProfileResp:
      type: object
      required:
        - employee
      properties:
        employee:
          $ref: '#/components/schemas/EmployeeProfile'
      example:
        employee:
          id: emp_12345
          email: employee@example.com
          name: 张三
          roles:
            - admin
            - warehouse_manager
          lastLoginAt: '2024-05-06T03:20:00Z'
          avatarUrl: 'https://cdn.example.com/avatar/emp_12345.png'
    Address:
      type: object
      description: 地址
      properties:
        postalCode:
          type: string
          description: 邮政编码
        detailAddress1:
          type: string
          description: 详细地址1
        detailAddress2:
          type: string
          description: 详细地址2
    Pagination:
      type: object
      properties:
        pagination:
          type: object
          properties:
            page:
              type: integer
              description: 页码
            itemsPerPage:
              type: integer
              description: 每页数量
            totalItems:
              type: integer
              description: 总数量
            totalPages:
              type: integer
              description: 总页数
    DashboardStats:
      type: object
